function pjGet(db,k){return new Promise(res=>{try{if(!db.objectStoreNames.contains('kv'))return res(null);const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}catch(e){res(null)}})}

function editItem(k){const r=k?Object.assign({},DB.recs.find(x=>x._k===k)):{_kind:'item',_k:uid('I|'),cat:'ppe',unit:'個',cycle:0};
 form(k?L('編輯品項','Edit item',''):L('新增品項','New item',''),[['code','text',L('代號','Code','')],['link','text',L('連結編號（資產或工務登記同一件物品的編號，可不填）','Linked code (same item in Assets or the facility register, optional)','លេខកូដភ្ជាប់ (ទ្រព្យសម្បត្តិ ឬបញ្ជីឧបករណ៍ មិនចាំបាច់)')],['cat','sel',L('類別','Category',''),CATS.map(c=>[c[0],c[1]+' '+L(...c[2])])],['zh','text','中文名稱'],['en','text','English name'],['km','text','ឈ្មោះខ្មែរ'],['unit','text',L('單位','Unit','')],['cycle','num',L('換新週期（月，0＝不用）','Replace every (months, 0 = none)','')],['spec','text',L('規格（顏色、尺寸、材質）','Spec','')],['photo','photo',L('標準照片','Standard photo','')],['note','area',L('說明（誰該有、怎麼發）','Who gets it / how','')]],r);
 $('mEditF').innerHTML=`${k?`<button class="btn danger" onclick="if(confirm('${L('刪除這個品項？','Delete item?','')}')){del('${k}');closeM('mEdit');renderAll()}">${tr('del')}</button>`:''}<button class="btn" onclick="closeM('mEdit')">${tr('cancel')}</button><button class="btn primary" onclick="saveItem()">${tr('save')}</button>`;$('mEdit')._rec=r}
window.saveItem=function(){const r=Object.assign($('mEdit')._rec,readForm());if(!r.code||!r.zh){toast(L('代號和中文名稱要填','Code and name required',''));return}r.link=String(r.link||'').trim().toUpperCase();if(r.link&&window.ItemLinks&&ItemLinks.options('issue').length&&!ItemLinks.find([r.link],'issue').some(x=>x.code===r.link)){toast('⚠ '+L('找不到這個連結編號（資產或工務登記裡沒有），請再確認，避免連錯','Linked code not found in Assets or the facility registers — please check','រកមិនឃើញលេខកូដភ្ជាប់ សូមពិនិត្យម្តងទៀត'));return}if(!DB.recs.some(x=>x._k===r._k))r._k='I|'+r.code;r.cycle=n(r.cycle);put(r);closeM('mEdit');renderAll()};
/* 卡片連結：員工卡、品項卡 */
window.openEmp=async function(no){if(!no)return;const E=await loadEmp();const e=E.get(String(no))||{no};const R=live('issue').filter(r=>String(r.empId)===String(no)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 $('mEditT').textContent='👤 '+no+' '+(e.name||'');$('mEditB').innerHTML=`<div class="notice">${esc(DEPTN[e.dept]||e.dept||'')} · ${esc(e.title||'')} · ${L('到職','joined','')} ${esc(e.join||'—')} · ${esc(e.status||'')}${e.leave?' · '+L('離職','left','')+' '+esc(e.leave):''} · <a href="../psjhr/#emp/${encodeURIComponent(no)}" target="_blank" class="lnk">VRT HR ↗</a></div><div class="table-wrap"><table data-keynote="off"><thead><tr><th>${L('日期','Date','')}</th><th>${L('類型','Type','')}</th><th>${L('品項','Item','')}</th><th class="num">${L('數量','Qty','')}</th><th>${L('原因','Reason','')}</th><th></th></tr></thead><tbody>${R.map(r=>`<tr><td>${esc(r.date)}</td><td>${typeName(r.type)}</td><td>${esc(itemName(r.item))}</td><td class="num">${esc(r.qty||1)}</td><td>${esc(reasonName(r.reason))}</td><td><button class="btn sm" onclick="editIssue('${r._k}')">✏️</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">${L('還沒有紀錄','No records yet','')}</td></tr>`}</tbody></table></div>`;
 $('mEditF').innerHTML=`<button class="btn" onclick="closeM('mEdit')">${tr('cancel')}</button><button class="btn" onclick="quickIssue('${esc(no)}','ID-C','resign','return')">↩️ ${L('記歸還','Record return','')}</button><button class="btn primary" onclick="quickIssue('${esc(no)}','ID-C','newhire')">＋ ${L('記發放','Record issue','')}</button>`;$('mEdit').classList.add('open')};
window.openItem=function(code){QI=code;UNIT='all';go('rec')};

/* ── 匯出／匯入 ── */
const XCOLS={issue:['date','type','empId','name','dept','item','qty','reason','by','note'],item:['code','link','cat','zh','en','km','unit','cycle','spec','note']};
function exportXlsx(){if(!window.XLSX){toast('XLSX ✗');return}const wb=XLSX.utils.book_new();Object.keys(XCOLS).forEach(k=>{const rows=live(k).map(r=>{const o={_k:r._k};XCOLS[k].forEach(c=>o[c]=r[c]==null?'':r[c]);return o});XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[Object.fromEntries(['_k'].concat(XCOLS[k]).map(c=>[c,'']))]),k)});
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['month','section','line','scarf_M','scarf_F','scarf_total','id_M','id_F','id_total']].concat(HIST)),'history');XLSX.writeFile(wb,'VRT_Issue_'+today()+'.xlsx')}
async function importFile(f){if(!f)return;try{let add=0;if(/\.(jpe?g|png|webp)$/i.test(f.name)){toast(L('照片請在「物品標準」或發放紀錄裡用拍照／選檔上傳','Add photos inside an item or record',''),4000);return}
 if(/\.(pdf|pptx?)$/i.test(f.name)){toast(L('PDF／PPT 請把內容的品項與數量轉成 Excel（用「⇩ Excel」下載的格式）再匯入；檔案本身請放雲端連結在備註','Convert PDF/PPT to the Excel template first',''),6000);return}
 if(/\.json$/i.test(f.name)){const d=JSON.parse(await f.text());(d.recs||d).forEach(r=>{if(r&&r._k&&r._kind){put(r);add++}})}
 else{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
  /* HR 每月人事報表：infor 分頁 Scarf issued / ID issued → 只顯示，不寫入個人紀錄 */
  if(wb.SheetNames.includes('infor')){toast(L('這是 HR 月報（各組人數）。歷史彙總已內建 2024–2025；新的月份請請 HR 改在這頁逐人記錄。','This is the monthly HR report (counts only).',''),6000)}
  wb.SheetNames.forEach(sn=>{const k=Object.keys(XCOLS).find(x=>sn.toLowerCase().startsWith(x));if(!k)return;XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''}).forEach(row=>{if(!XCOLS[k].some(c=>String(row[c]||'').trim()))return;const o={_kind:k,_k:row._k||(k==='item'?'I|'+row.code:uid('S|'))};XCOLS[k].forEach(c=>{let v=row[c];if(v instanceof Date)v=dstr(v);if(v!==''&&v!=null)o[c]=v});if(k==='issue'){o.qty=n(o.qty)||1;o.type=o.type||'issue'}const cur=DB.recs.find(x=>x._k===o._k);put(Object.assign({},cur||{},o));add++})})}
 renderAll();toast('✅ '+L('匯入','Imported','បាននាំចូល')+' '+add)}catch(e){toast('❌ '+(e.message||e),4000)}}
function tgText(){const R=perIssues();const by={};R.forEach(r=>{const k=itemName(r.item);by[k]=(by[k]||0)+(r.type==='return'?0:(n(r.qty)||1))});const ret=R.filter(r=>r.type==='return').length;const lang=$('tgLang').value;
 const zh=['🪪 員工配發摘要｜'+perLabel(),...Object.entries(by).map(([k,v])=>'• '+k+'：'+v),'↩️ 歸還 '+ret+' 筆'],en=['🪪 Staff issue summary | '+perLabel(),...Object.entries(by).map(([k,v])=>'• '+k+': '+v),'↩️ Returned '+ret];
 return lang==='zh'?zh.join('\n'):lang==='en'?en.join('\n'):zh.join('\n')+'\n\n'+en.join('\n')}
function openTg(){$('mTg').classList.add('open');refreshTg()}
function refreshTg(){$('tgPrev').textContent=tgText()}
async function sendTg(){try{await postGas({action:'telegram',tool:TOOL,module:'issue',period:perLabel(),periodType:UNIT,messageType:'summary',text:tgText()});closeM('mTg');toast('✅ '+L('已發送','Sent','បានផ្ញើ'))}catch(e){toast('❌ '+(e.message||e),4000)}}
function applyLang(){document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tr(el.dataset.t));$('ttl').textContent=L('員工配發（廠牌・頭巾・PPE・制服）','Staff Issue (ID · Scarf · PPE · Uniform)','ការចេញសម្ភារៈបុគ្គលិក');document.documentElement.lang=LANG==='zh'?'zh-TW':LANG==='km'?'km':'en'}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem(LANG_KEY,LANG)}catch(e){}applyLang();renderAll()});
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
(function init(){load();if(new URLSearchParams(location.search).get('from')==='admin'){$('backLink').href='https://saintdou-weng.github.io/ac-admin/'}
 applyLang();renderAll();setSt(gasUrl()?'☁️':'☁️ —');
 const tryInstall=c=>{if(window.HRAAutoSync&&window.HRASmartSync){HRAAutoSync.install({key:TOOL,pull:cloudPull,push:cloudPush,canSync:()=>!!gasUrl(),startDelay:450,downId:'btn-cloud-down',upId:'btn-cloud-up'})}else if(c<40)setTimeout(()=>tryInstall(c+1),250)};tryInstall(0);
})();
