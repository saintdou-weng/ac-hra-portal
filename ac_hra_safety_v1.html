        培訓計劃的「培訓材料」分頁另有連結）。雲端有的記錄用現有的補上，沒找到的照對 VRT 的認知補上。

  起始資料（只放不含個資的內容；個資只存雲端）：
   · 消防演習 2019–2025：Fire drill practice record 2019-2021.xlsx＋每次的 VRT Fire Drill Practice 簡報／PDF（人數依部門）

   · 急救人員：VRT Emergency Action Plan（2025-07-07）、Fire drill & evacuation plan 2025、急救證書 2023-05-03

   · 離職面談：表單照 VRT-F-HR02 Employee Resign Survey 的 A–I 原因；名單可從入離職（onboarding 雲端）帶入本月離職的人

let DB={recs:[],seeded:false,updatedAt:''};
function load(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v&&Array.isArray(v.recs))DB=v}catch(e){}
 const have=new Set(DB.recs.map(r=>r._k));let add=0;SEED.forEach(s=>{if(!have.has(s._k)){DB.recs.push(JSON.parse(JSON.stringify(s)));add++}});if(add)save('seed',true)}
function save(reason,quiet){DB.updatedAt=nowIso();try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){console.warn(e)}
 try{localStorage.setItem('ac_hra_safety_meta',JSON.stringify({count:live().length,updatedAt:DB.updatedAt}))}catch(e){}
 if(!quiet&&!_applying&&gasUrl()&&window.HRAAutoSync)HRAAutoSync.schedule(TOOL,reason||'change',{},900)}
const live=k=>DB.recs.filter(r=>r&&!r.deleted&&(!k||r._kind===k));
function put(r){r.updatedAt=nowIso();delete r.seed;const i=DB.recs.findIndex(x=>x._k===r._k);if(i>=0)DB.recs[i]=r;else DB.recs.push(r);save('edit')}
function del(k){const r=DB.recs.find(x=>x._k===k);if(!r)return;r.deleted=true;r.updatedAt=nowIso();save('delete')}

 $('mEditF').innerHTML=`${isNew?'':`<button class="btn danger" id="fDel">🗑 ${L('刪除','Delete','លុប')}</button>`}<span class="grow"></span><button class="btn" onclick="closeM('mEdit')">${tr('cancel')}</button><button class="btn primary" id="fSave">💾 ${L('儲存','Save','រក្សាទុក')}</button>`;
 $('mEdit').classList.add('open');
 $('fSave').onclick=()=>{const x=Object.assign({},rec);document.querySelectorAll('#mEditB [data-f]').forEach(el=>{const k=el.dataset.f;if(el.type==='checkbox')x[k]=el.checked?1:0;else if(el.type==='number')x[k]=el.value===''?null:Number(el.value);else x[k]=el.value.trim()});
  if(before)before(x);if(!x.planned)delete x.planned;put(x);closeM('mEdit');renderAll();toast('✅ '+L('已儲存','Saved','បានរក្សាទុក'))};
 if($('fDel'))$('fDel').onclick=()=>{if(!confirm(L('確定刪除這一筆？','Delete this record?','លុបកំណត់ត្រានេះ?')))return;del(rec._k);closeM('mEdit');renderAll();toast(L('已刪除','Deleted','បានលុប'))}}
function openAdd(){({drill:editDrill,injury:editInjury,aider:editAider,committee:editCommittee,exit:editExit}[TAB]||editDrill)()}

/* ── 匯出／匯入 ── */
const XCOLS={drill:['date','site','prod','cut','wh','office','admin','m','f','total','time','evac','police','helpers','planned','src','url','note'],injury:['date','time','empId','name','area','type','descZh','descEn','descKm','hospital','witness','leaveDays','nssf','returnDate','action','status','src'],aider:['name','empId','pos','dept','area','role','cert','certBy','expiry','src','url','note'],committee:['type','name','since','freq','chair','members','docs','url','duty'],meeting:['cm','date','time','attendees','topic','concern','decision','planned','src','url','note'],exit:['date','empId','name','dept','position','joinDate','lastDay','interviewer','reasons','other','suggestion','mgmt','rehire']};
function exportXlsx(){if(!window.XLSX){toast('XLSX ✗');return}const wb=XLSX.utils.book_new();Object.keys(XCOLS).forEach(k=>{const rows=live(k).map(r=>{const o={_k:r._k};XCOLS[k].forEach(c=>{let v=r[c];if(Array.isArray(v))v=c==='members'?v.map(m=>m.join(' | ')).join('\n'):v.join(',');o[c]=v==null?'':v});return o});XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{_k:''}]),k)});XLSX.writeFile(wb,'VRT_Safety_ER_'+today()+'.xlsx')}
async function importFile(f){if(!f)return;try{let add=0;if(/\.json$/i.test(f.name)){const d=JSON.parse(await f.text());(d.recs||d).forEach(r=>{if(r&&r._k&&r._kind){put(r);add++}})}
 else{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});wb.SheetNames.forEach(sn=>{const k=Object.keys(XCOLS).find(x=>sn.toLowerCase().startsWith(x));if(!k)return;XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''}).forEach(row=>{const o={_kind:k,_k:row._k||(k[0].toUpperCase()+'|'+uid(''))};XCOLS[k].forEach(c=>{let v=row[c];if(v instanceof Date)v=v.toISOString().slice(0,10);if(c==='reasons')v=String(v||'').split(/[,\s]+/).filter(Boolean);if(c==='members')v=String(v||'').split('\n').filter(Boolean).map(s=>s.split('|').map(z=>z.trim()));if(v!==''&&v!=null)o[c]=v});const cur=DB.recs.find(x=>x._k===o._k);put(Object.assign({},cur||{},o));add++})})}
 renderAll();toast('✅ '+L('匯入','Imported','បាននាំចូល')+' '+add)}catch(e){toast('❌ '+(e.message||e),4000)}}

/* ── Telegram 摘要（只發數字） ── */
function tgText(){const lg=$('tgLang').value,per=$('tgPer').value,t0=today(),key=per==='year'?t0.slice(0,4):t0.slice(0,7),inP=d=>String(d||'').startsWith(key);
 const Z=(zh,en,km)=>lg==='zh'?zh:lg==='en'?en:lg==='enkm'?en+(km?' / '+km:''):zh+' '+en;
 const dr=live('drill').filter(r=>inP(r.date)&&!r.planned),nd=nextDrillDue(),inj=live('injury').filter(r=>inP(r.date)),aid=live('aider'),mts=live('meeting').filter(r=>inP(r.date)&&!r.planned),ex=live('exit').filter(r=>inP(r.date));
 const byT={};inj.forEach(r=>byT[r.type]=(byT[r.type]||0)+1);
 const L2=[`🦺 <b>${Z('職安衛／員工關係','Safety & Employee Relations','សុវត្ថិភាព និងទំនាក់ទំនងបុគ្គលិក')}｜${key}</b>`,''];
 L2.push(`🔥 ${Z('消防演習','Fire drill','សមយុទ្ធ')}：${dr.length} · ${Z('上次','last','ចុងក្រោយ')} ${nd.last||'—'} · ${Z('下次應辦','next due','លើកក្រោយ')} ${nd.due||'—'}${nd.due&&nd.due<=t0.slice(0,7)?' 🔴':' 🟢'}`);
 dr.forEach(r=>L2.push(`   • ${r.date} 👥 ${drillTotal(r)||'—'} ⏱ ${esc(r.evac||'')}`));
 L2.push(`🩹 ${Z('工傷','Work injury','គ្រោះថ្នាក់')}：${inj.length}${inj.length?' （'+Object.keys(byT).map(k=>itName(k).split(' ')[0]+byT[k]).join(' ')+'）':' 🟢'}`);
 L2.push(`⛑️ ${Z('急救人員','First aiders','អ្នកសង្គ្រោះ')}：${aid.length} · ${Z('證照待補','cert. to fill','ត្រូវបំពេញ')} ${aid.filter(a=>!a.cert).length}`);
 L2.push(`👥 ${Z('委員會會議','Committee meetings','ប្រជុំ')}：${mts.length}`);
 L2.push(`🚪 ${Z('離職面談','Exit interviews','សម្ភាសន៍លាលែង')}：${ex.length}${ex.length?' · '+Z('原因最多','top','ច្រើន')+' '+esc((Object.entries(ex.reduce((a,r)=>{(r.reasons||[]).forEach(c=>a[c]=(a[c]||0)+1);return a},{})).sort((a,b)=>b[1]-a[1])[0]||[''])[0]):''}`);
 L2.push('',`<i>${Z('只含件數與日期，不含姓名、工號。','Counts and dates only — no names or IDs.','ចំនួន និងកាលបរិច្ឆេទតែប៉ុណ្ណោះ')}</i>`);return L2.join('\n')}
function openTg(){$('mTg').classList.add('open');refreshTg()}
function refreshTg(){$('tgPrev').textContent=tgText()}
async function sendTg(){try{await postGas({action:'telegram',tool:TOOL,module:'safety',period:$('tgPer').value==='year'?today().slice(0,4):today().slice(0,7),periodType:$('tgPer').value,messageType:'summary',text:tgText()});closeM('mTg');toast('✅ '+L('已發送','Sent','បានផ្ញើ'))}catch(e){toast('❌ '+(e.message||e),4000)}}

function applyLang(){document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tr(el.dataset.t));$('ttl').textContent=L('職安衛／員工關係','Safety & Employee Relations','សុវត្ថិភាព និងទំនាក់ទំនងបុគ្គលិក');document.documentElement.lang=LANG==='zh'?'zh-TW':LANG==='km'?'km':'en'}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem(LANG_KEY,LANG)}catch(e){}applyLang();renderAll()});
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
(function init(){load();const ys=years();$('yearSel').innerHTML=`<option value="all">${L('全部年度','All years','គ្រប់ឆ្នាំ')}</option>`+ys.map(y=>`<option value="${y}">${y}</option>`).join('');$('yearSel').value='all';
 if(new URLSearchParams(location.search).get('from')==='admin')$('backLink').href='https://saintdou-weng.github.io/ac-admin/';
 applyLang();renderAll();setSt(gasUrl()?'☁️':'☁️ —');
 const tryInstall=(n)=>{if(window.HRAAutoSync&&window.HRASmartSync){HRAAutoSync.install({key:TOOL,pull:cloudPull,push:cloudPush,canSync:()=>!!gasUrl(),startDelay:450,downId:'btn-cloud-down',upId:'btn-cloud-up'})}else if(n<40)setTimeout(()=>tryInstall(n+1),250)};tryInstall(0);
})();
